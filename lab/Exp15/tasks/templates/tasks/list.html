<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task list</title></head><body><main><h1>My tasks</h1><form method="post" action="{% url 'task-add' %}">{% csrf_token %}<label>Task <input name="title" maxlength="120" required></label><label>Notes <input name="notes"></label><button>Add</button></form><ul>{% for task in tasks %}<li>{% if task.complete %}<s>{{ task.title }}</s>{% else %}{{ task.title }}{% endif %}{% if task.notes %} — {{ task.notes }}{% endif %}<form method="post" action="{% url 'task-toggle' task.id %}" style="display:inline">{% csrf_token %}<button>{% if task.complete %}Reopen{% else %}Complete{% endif %}</button></form><form method="post" action="{% url 'task-delete' task.id %}" style="display:inline">{% csrf_token %}<button>Delete</button></form></li>{% empty %}<li>No tasks added.</li>{% endfor %}</ul></main></body></html>
