<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Board · Experiments 07–08</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head>
<body><main class="shell"><header><p class="eyebrow">Backend Development · Experiments 07–08</p><h1>Task Board</h1><p>Small tasks, kept in this browser.</p></header><form id="task-form"><label for="task-title">New task</label><div class="composer"><input id="task-title" name="title" maxlength="100" placeholder="e.g. Review route handlers" required><button>Add task</button></div></form><section aria-labelledby="list-heading"><div class="list-heading"><h2 id="list-heading">Your list</h2><button id="clear-done" class="quiet" type="button">Clear completed</button></div><ul id="task-list" aria-live="polite"></ul><p id="empty-state" class="empty">No tasks yet. Add one above to begin.</p></section><footer><span id="task-count">0 open tasks</span><span>Saved on this device</span></footer></main></body></html>
